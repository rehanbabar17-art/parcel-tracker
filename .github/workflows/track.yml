name: Track Parcels

on:
  schedule:
    - cron: '0 * * * *'  # Every hour - GitHub's built-in schedule

  workflow_dispatch:  # Manual trigger (Actions tab)

  repository_dispatch:  # Triggered by 3rd-party cron (cron-job.org etc.)
    types: [hourly-track]

permissions:
  contents: read   # Public repo: code only, never writes back
  actions: write   # Needed to save/restore the tracking-state cache

jobs:
  track:
    runs-on: ubuntu-latest
    concurrency:
      group: parcel-tracking
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Restore the previous tracking state (statuses we already notified about).
      # A new cache entry is written on every run, and the newest one is restored.
      - name: Restore tracking state
        uses: actions/cache@v4
        with:
          path: state.json
          key: parcel-state-${{ github.run_id }}
          restore-keys: |
            parcel-state-
          save-always: true

      - name: Track parcels
        env:
          TRACKER_CONFIG: ${{ secrets.TRACKER_CONFIG }}
        run: npm run track
