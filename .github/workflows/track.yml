name: Track Parcels
on:
  schedule:
    - cron: '0 * * * *'  # Every hour
  workflow_dispatch:
    inputs:
      clear_history:
        description: 'Clear old parcel status/history before this run'
        required: false
        type: boolean
        default: false
      send_notifications:
        description: 'Send ntfy notifications during this run'
        required: false
        type: boolean
        default: false
  repository_dispatch:
    types: [hourly-track]
permissions:
  contents: read
jobs:
  track:
    runs-on: ubuntu-latest
    concurrency:
      group: parcel-tracking
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Download private data from B2
        id: b2_download
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
        run: npm run b2:download
      - name: Clear old parcel history before tracking
        id: clear_history
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.clear_history }}
        run: npm run b2:clear-history
      - name: Track parcels
        id: track
        env:
          TRACKER_SILENT: ${{ github.event_name == 'workflow_dispatch' && !inputs.send_notifications && '1' || '0' }}
        run: npm run track
      - name: Upload updated private data to B2
        if: ${{ always() && steps.b2_download.outcome == 'success' && steps.track.outcome == 'success' && (steps.clear_history.outcome == 'success' || steps.clear_history.outcome == 'skipped') }}
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
        run: npm run b2:upload
      - name: Secure cleanup of local private data
        if: always()
        run: rm -f config.json state.json config.json.*.tmp state.json.*.tmp
