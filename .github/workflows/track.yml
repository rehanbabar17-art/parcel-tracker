name: Track Parcels
on:
  schedule:
    - cron: '0 * * * *'  # Every hour
  workflow_dispatch:
    inputs:
      clear_history:
        description: 'Clear old parcel status/history before this run'
        required: false
        type: boolean
        default: false
      send_notifications:
        description: 'Send ntfy notifications during this run'
        required: false
        type: boolean
        default: false
  repository_dispatch:
    types: [hourly-track]
permissions:
  contents: read
jobs:
  track:
    runs-on: ubuntu-latest
    concurrency:
      group: parcel-tracking
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Download private data from MEGA
        id: mega_download
        env:
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
          TRACKER_CONFIG: ${{ secrets.TRACKER_CONFIG }}
        run: npm run mega:download
      - name: Clear old parcel history before tracking
        id: clear_history
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.clear_history }}
        run: npm run mega:clear-history
      - name: Track parcels
        id: track
        env:
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
          TRACKER_SILENT: ${{ github.event_name == 'workflow_dispatch' && !inputs.send_notifications && '1' || '0' }}
        run: npm run track
      - name: Upload updated private data to MEGA
        if: ${{ always() && steps.mega_download.outcome == 'success' && steps.track.outcome == 'success' && (steps.clear_history.outcome == 'success' || steps.clear_history.outcome == 'skipped') }}
        env:
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
        run: npm run mega:upload
      - name: Secure cleanup of local private data
        if: always()
        run: rm -f config.json state.json config.json.*.tmp state.json.*.tmp
