name: Track Parcels
on:
  schedule:
    - cron: '0 * * * *'  # Every hour
  workflow_dispatch:
  repository_dispatch:
    types: [hourly-track]
permissions:
  contents: read
jobs:
  track:
    runs-on: ubuntu-latest
    concurrency:
      group: parcel-tracking
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Download private data from MEGA
        id: mega_download
        env:
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
          TRACKER_CONFIG: ${{ secrets.TRACKER_CONFIG }}
        run: npm run mega:download
      - name: Track parcels
        env:
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
          TRACKER_SILENT: '0'
        run: npm run track
      - name: Upload updated private data to MEGA
        if: ${{ always() && steps.mega_download.outcome == 'success' }}
        env:
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
        run: npm run mega:upload
      - name: Secure cleanup of local private data
        if: always()
        run: rm -f config.json state.json config.json.*.tmp state.json.*.tmp
