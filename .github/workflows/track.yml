name: Track Parcels

on:
  schedule:
    - cron: '0 * * * *'  # Every hour

  workflow_dispatch:  # Manual trigger with interactive parcel management
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'track'
        type: choice
        options:
          - track
          - add_parcel
          - remove_parcel
          - list_parcels
      parcel_name:
        description: 'Parcel Name (if adding or removing)'
        required: false
        type: string
      courier:
        description: 'Courier'
        required: false
        default: 'tcs'
        type: choice
        options:
          - tcs
          - leopards
          - postex
          - daraz
          - dex
          - trax
      tracking_number:
        description: 'Tracking Number (if adding)'
        required: false
        type: string

  repository_dispatch:
    types: [hourly-track]

permissions:
  contents: read

jobs:
  track:
    runs-on: ubuntu-latest
    concurrency:
      group: parcel-tracking
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      # 1. Download config.json and state.json from private MEGA storage
      - name: Download data from MEGA
        env:
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
        run: npm run mega:download

      # 2. Manage parcel configuration
      - name: Manage parcel configuration
        env:
          ACTION: ${{ github.event.inputs.action || 'track' }}
          PARCEL_NAME: ${{ github.event.inputs.parcel_name || '' }}
          COURIER: ${{ github.event.inputs.courier || '' }}
          TRACKING_NUMBER: ${{ github.event.inputs.tracking_number || '' }}
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
        run: npm run manage

      # 3. Track active parcels and send push notifications
      - name: Track parcels
        env:
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
        run: npm run track

      # 4. Upload updated config.json and state.json back to MEGA (always runs)
      - name: Upload data back to MEGA
        if: always()
        env:
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
        run: npm run mega:upload

      # 5. Secure cleanup: delete local config and state files
      - name: Secure cleanup local data
        if: always()
        run: rm -f config.json state.json
